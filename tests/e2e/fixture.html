<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rawafid RTL toolkit browser fixture</title>
  <link rel="stylesheet" href="/styles/a11y.css">
  <link rel="stylesheet" href="/styles/logical.css">
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    .row { display: flex; gap: 1rem; align-items: center; }
    .logical-box { position: relative; inline-size: min(20rem, 100%); block-size: 3rem; }
    .logical-probe { position: absolute; inset-inline-start: 16px; inline-size: 1rem; block-size: 1rem; }
  </style>
</head>
<body>
  <a class="rawafid-skip-link rawafid-focus-ring" href="#main">تجاوز إلى المحتوى</a>
  <header><h1>اختبار واجهة عربية</h1></header>
  <main id="main" tabindex="-1">
    <p>نص عربي مع <bdi>support@example.org</bdi> ومحتوى إنجليزي.</p>
    <p id="script-direction"></p>
    <nav aria-label="التنقل بين الصفحات" class="row">
      <a class="rawafid-focus-ring" href="?page=1" aria-current="page">١</a>
      <a class="rawafid-focus-ring" href="?page=2" rel="next">٢</a>
    </nav>
    <button id="announce" class="rawafid-focus-ring" type="button">أعلن حالة الحفظ</button>
    <div class="logical-box" aria-hidden="true"><span class="logical-probe"></span></div>
  </main>
  <script type="module">
    import { announce, getLocaleDirection } from '/dist/index.js';

    const output = document.querySelector('#script-direction');
    output.textContent = `ar-Latn: ${getLocaleDirection('ar-Latn')}`;
    output.dataset.direction = getLocaleDirection('ar-Latn');

    document.querySelector('#announce').addEventListener('click', () => {
      announce('تم حفظ الإعدادات', { clearAfterMs: 2000 });
    });
  </script>
</body>
</html>
