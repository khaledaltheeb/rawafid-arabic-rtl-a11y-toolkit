<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rawafid accessible patterns fixture</title>
  <link rel="stylesheet" href="/styles/a11y.css">
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.6; }
    section { margin-block: 2rem; }
    [hidden] { display: none !important; }
    [role="menu"] { border: 1px solid currentColor; padding: .5rem; inline-size: max-content; }
    [role="menuitem"] { display: block; inline-size: 100%; text-align: start; }
    [role="tablist"] { display: flex; gap: .5rem; border-block-end: 1px solid currentColor; }
    [role="tabpanel"] { padding-block: 1rem; }
    .pagination-list { display: flex; flex-wrap: wrap; gap: .5rem; list-style: none; padding: 0; }
    .pagination-list a { display: inline-block; min-inline-size: 2rem; text-align: center; }
    .pagination-gap { padding-inline: .25rem; }
    .backdrop { position: fixed; inset: 0; display: grid; place-items: center; background: rgb(0 0 0 / .35); }
    .dialog { background: Canvas; color: CanvasText; padding: 1.5rem; max-inline-size: 32rem; border: 2px solid currentColor; }
  </style>
</head>
<body>
  <main id="page-content">
    <h1>أنماط وصول مرجعية</h1>

    <section aria-labelledby="disclosure-heading">
      <h2 id="disclosure-heading">Disclosure</h2>
      <button id="disclosure-button">عرض التفاصيل</button>
      <div id="disclosure-panel" hidden>تفاصيل عربية / English details / 123</div>
    </section>

    <section aria-labelledby="menu-heading">
      <h2 id="menu-heading">Menu button</h2>
      <button id="menu-button">الإجراءات</button>
      <div id="menu" role="menu" hidden>
        <button role="menuitem" tabindex="-1">فتح</button>
        <button role="menuitem" tabindex="-1">إعادة تسمية</button>
        <button role="menuitem" tabindex="-1">حذف</button>
      </div>
    </section>

    <section aria-labelledby="tabs-heading">
      <h2 id="tabs-heading">Tabs</h2>
      <div id="tabs" role="tablist" aria-label="أقسام الحساب">
        <button id="tab-profile" role="tab" aria-controls="panel-profile">الملف</button>
        <button id="tab-security" role="tab" aria-controls="panel-security">الأمان</button>
        <button id="tab-notifications" role="tab" aria-controls="panel-notifications">الإشعارات</button>
      </div>
      <div id="panel-profile" role="tabpanel" aria-labelledby="tab-profile">محتوى الملف</div>
      <div id="panel-security" role="tabpanel" aria-labelledby="tab-security" hidden>محتوى الأمان</div>
      <div id="panel-notifications" role="tabpanel" aria-labelledby="tab-notifications" hidden>محتوى الإشعارات</div>
    </section>

    <section aria-labelledby="pagination-heading">
      <h2 id="pagination-heading">Pagination</h2>
      <nav id="pagination" aria-label="صفحات النتائج">
        <ul id="pagination-list" class="pagination-list"></ul>
      </nav>
    </section>

    <section aria-labelledby="dialog-heading">
      <h2 id="dialog-heading">Modal dialog</h2>
      <button id="open-dialog">فتح النافذة</button>
    </section>
  </main>

  <div id="dialog-backdrop" class="backdrop" hidden>
    <div id="dialog" class="dialog">
      <h2 id="modal-title">تأكيد الإجراء</h2>
      <p id="modal-description">مثال محايد لا يفرض منطق التطبيق.</p>
      <button id="dialog-first">الإجراء الأول</button>
      <button id="dialog-last">إغلاق</button>
    </div>
  </div>

  <script type="module">
    import {
      disclosureButtonAttributes,
      getFocusableElements,
      getPaginationModel,
      menuButtonAttributes,
      menuOpenTargetFromKey,
      modalDialogAttributes,
      nextContainedTabIndex,
      nextRovingFocusIndex,
      rememberFocus,
      rovingTabIndexes,
    } from '/dist/index.js';

    function applyAttributes(element, attributes) {
      for (const [name, value] of Object.entries(attributes)) {
        if (name === 'type') {
          element.type = value;
        } else {
          element.setAttribute(name, String(value));
        }
      }
    }

    const disclosureButton = document.querySelector('#disclosure-button');
    const disclosurePanel = document.querySelector('#disclosure-panel');
    let disclosureExpanded = false;
    const renderDisclosure = () => {
      applyAttributes(disclosureButton, disclosureButtonAttributes(disclosureExpanded, 'disclosure-panel'));
      disclosurePanel.hidden = !disclosureExpanded;
    };
    disclosureButton.addEventListener('click', () => {
      disclosureExpanded = !disclosureExpanded;
      renderDisclosure();
    });
    renderDisclosure();

    const menuButton = document.querySelector('#menu-button');
    const menu = document.querySelector('#menu');
    const menuItems = [...menu.querySelectorAll('[role="menuitem"]')];
    let menuExpanded = false;
    const renderMenu = () => {
      applyAttributes(menuButton, menuButtonAttributes(menuExpanded, 'menu'));
      menu.hidden = !menuExpanded;
    };
    const openMenu = (target = 'first') => {
      menuExpanded = true;
      renderMenu();
      const item = target === 'last' ? menuItems.at(-1) : menuItems[0];
      item?.focus();
    };
    const closeMenu = () => {
      menuExpanded = false;
      renderMenu();
      menuButton.focus();
    };
    menuButton.addEventListener('click', () => menuExpanded ? closeMenu() : openMenu('first'));
    menuButton.addEventListener('keydown', (event) => {
      const target = menuOpenTargetFromKey(event.key);
      if (!target) return;
      event.preventDefault();
      openMenu(target);
    });
    menu.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        event.preventDefault();
        closeMenu();
      }
    });
    renderMenu();

    const tablist = document.querySelector('#tabs');
    const tabs = [...tablist.querySelectorAll('[role="tab"]')];
    const tabPanels = tabs.map((tab) => document.getElementById(tab.getAttribute('aria-controls')));
    let activeTab = 0;

    const renderTabs = () => {
      const tabIndexes = rovingTabIndexes(activeTab, tabs.length);
      tabs.forEach((tab, index) => {
        const selected = index === activeTab;
        tab.tabIndex = tabIndexes[index];
        tab.setAttribute('aria-selected', String(selected));
        tabPanels[index].hidden = !selected;
      });
    };

    const activateTab = (index, moveFocus = true) => {
      activeTab = index;
      renderTabs();
      if (moveFocus) tabs[index]?.focus();
    };

    tablist.addEventListener('click', (event) => {
      const index = tabs.indexOf(event.target.closest?.('[role="tab"]'));
      if (index >= 0) activateTab(index, false);
    });

    tablist.addEventListener('keydown', (event) => {
      const currentIndex = tabs.indexOf(document.activeElement);
      if (currentIndex < 0) return;
      const nextIndex = nextRovingFocusIndex(currentIndex, tabs.length, event.key, {
        direction: 'rtl',
        orientation: 'horizontal',
        loop: true,
      });
      if (nextIndex === currentIndex) return;
      event.preventDefault();
      activateTab(nextIndex);
    });
    renderTabs();

    const paginationList = document.querySelector('#pagination-list');
    const paginationModel = getPaginationModel(7, 20, 2);
    const paginationEntries = [
      { page: paginationModel.previousPage, label: 'السابق', rel: 'prev' },
      ...paginationModel.items.map((item) => item === 'gap' ? { gap: true } : { page: item, label: String(item) }),
      { page: paginationModel.nextPage, label: 'التالي', rel: 'next' },
    ];

    for (const entry of paginationEntries) {
      const listItem = document.createElement('li');
      if ('gap' in entry) {
        const gap = document.createElement('span');
        gap.className = 'pagination-gap';
        gap.setAttribute('aria-hidden', 'true');
        gap.textContent = '…';
        listItem.append(gap);
      } else if (entry.page !== undefined) {
        const link = document.createElement('a');
        link.href = `#page-${entry.page}`;
        link.dataset.page = String(entry.page);
        link.textContent = entry.label;
        if (entry.rel) link.rel = entry.rel;
        if (entry.page === paginationModel.currentPage) {
          link.setAttribute('aria-current', 'page');
          link.setAttribute('aria-label', `الصفحة ${entry.page}، الصفحة الحالية`);
        } else if (/^\d+$/u.test(entry.label)) {
          link.setAttribute('aria-label', `الصفحة ${entry.page}`);
        }
        listItem.append(link);
      }
      paginationList.append(listItem);
    }

    const pageContent = document.querySelector('#page-content');
    const openDialogButton = document.querySelector('#open-dialog');
    const backdrop = document.querySelector('#dialog-backdrop');
    const dialog = document.querySelector('#dialog');
    const closeDialogButton = document.querySelector('#dialog-last');
    let restoreDialogFocus = () => undefined;

    applyAttributes(dialog, modalDialogAttributes({
      labelledBy: 'modal-title',
      describedBy: 'modal-description',
    }));

    const closeDialog = () => {
      backdrop.hidden = true;
      pageContent.removeAttribute('inert');
      restoreDialogFocus();
    };

    openDialogButton.addEventListener('click', () => {
      restoreDialogFocus = rememberFocus(document);
      pageContent.setAttribute('inert', '');
      backdrop.hidden = false;
      getFocusableElements(dialog)[0]?.focus();
    });
    closeDialogButton.addEventListener('click', closeDialog);
    dialog.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        event.preventDefault();
        closeDialog();
        return;
      }
      if (event.key !== 'Tab') return;
      const items = getFocusableElements(dialog);
      const current = items.indexOf(document.activeElement);
      if (current < 0) return;
      event.preventDefault();
      const next = nextContainedTabIndex(current, items.length, event.shiftKey);
      if (next >= 0) items[next]?.focus();
    });
  </script>
</body>
</html>
