name: Bug report
description: Report a reproducible RTL, localization, accessibility, or toolkit defect.
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal reproduction steps or repository link.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node version, locale, and direction.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This report contains no private Rawafid data, secrets, or scientific content.
          required: true
