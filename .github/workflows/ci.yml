name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.17.0 --no-audit --no-fund
      - name: Install dependencies deterministically
        run: npm ci --no-audit --no-fund
      - name: Verify
        run: npm run check

  rtl-a11y:
    name: RTL + accessibility browsers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.17.0 --no-audit --no-fund
      - name: Install dependencies deterministically
        run: npm ci --no-audit --no-fund
      - name: Generate localization QA evidence
        run: npm run localization:evidence
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests
        run: npm run test:e2e
      - name: Validate partner evidence summary
        run: node scripts/validate-partner-evidence-summary.mjs partner-results/evidence-summary.json
      - name: Upload partner interoperability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: partner-interoperability-evidence
          path: |
            partner-results/
            conformance/manifest.json
            conformance/partner-suite.json
            qa/localization-contract.json
            tests/fixtures/unicode-display-risk-corpus.json
            tests/fixtures/grapheme-interoperability-corpus.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
