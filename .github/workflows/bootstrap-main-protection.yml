name: Bootstrap main protection

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-main-protection.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || secrets.REPO_ADMIN_TOKEN || secrets.GITHUB_PAT || secrets.GH_PAT || secrets.ADMIN_TOKEN }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Require repository administration credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo '::error::No repository-administration token is available under the supported secret names. Branch protection was not changed.'
            exit 1
          fi

      - name: Protect main branch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/protection.json <<'JSON'
          {
            "required_status_checks": null,
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 0,
              "require_last_push_approval": false
            },
            "restrictions": null,
            "required_linear_history": true,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "block_creations": false,
            "required_conversation_resolution": true,
            "lock_branch": false,
            "allow_fork_syncing": false
          }
          JSON
          status="$(curl -sS -o /tmp/protection-response.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/branches/main/protection" \
            --data-binary @/tmp/protection.json)"
          if [ "$status" != "200" ]; then
            node -e "const fs=require('fs'); const p='/tmp/protection-response.json'; if(fs.existsSync(p)){const r=JSON.parse(fs.readFileSync(p,'utf8')); console.error(r.message || 'GitHub branch protection request failed');}" || true
            echo "::error::Branch protection API returned HTTP ${status}."
            exit 1
          fi

      - name: Verify protection state
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/branches/main/protection" > /tmp/protection.json
          node <<'NODE'
          const p = require('/tmp/protection.json');
          if (!p.enforce_admins?.enabled) throw new Error('Admin enforcement is not enabled');
          if (!p.required_pull_request_reviews) throw new Error('Pull request protection is not enabled');
          if (!p.required_linear_history?.enabled) throw new Error('Linear history is not required');
          if (p.allow_force_pushes?.enabled) throw new Error('Force pushes are still allowed');
          if (p.allow_deletions?.enabled) throw new Error('Branch deletion is still allowed');
          if (!p.required_conversation_resolution?.enabled) throw new Error('Conversation resolution is not required');
          console.log('main branch protection verified.');
          NODE
