name: Bootstrap first release

on:
  workflow_run:
    workflows: ["Release preflight"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact preflight commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Create first release if absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          api="https://api.github.com/repos/${REPOSITORY}"

          curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}/commits/main" > /tmp/main-commit.json
          current_main="$(node -e "const r=require('/tmp/main-commit.json'); if(typeof r.sha!=='string') throw new Error('Missing main SHA'); process.stdout.write(r.sha)")"
          if [ "$TARGET_SHA" != "$current_main" ]; then
            echo "Preflight commit ${TARGET_SHA} is no longer current main ${current_main}; release bootstrap skipped."
            exit 0
          fi

          status="$(curl -sS -o /tmp/release.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}/releases/tags/${tag}")"

          if [ "$status" = "200" ]; then
            echo "Release ${tag} already exists; bootstrap is idempotent."
            exit 0
          fi
          if [ "$status" != "404" ]; then
            cat /tmp/release.json >&2
            echo "Unexpected release lookup status: ${status}" >&2
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const [tag, sha] = process.argv.slice(1);
            fs.writeFileSync("/tmp/create-release.json", JSON.stringify({
              tag_name: tag,
              target_commitish: sha,
              name: tag,
              body: "First public release of the Rawafid Arabic/RTL Accessibility & Localization Toolkit. Built from the current main commit after the repository release preflight passed.",
              draft: false,
              prerelease: false,
              generate_release_notes: true
            }));
          ' "$tag" "$TARGET_SHA"

          create_status="$(curl -sS -o /tmp/created-release.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}/releases" \
            --data-binary @/tmp/create-release.json)"

          if [ "$create_status" != "201" ]; then
            cat /tmp/created-release.json >&2
            echo "GitHub Release creation failed with HTTP ${create_status}." >&2
            exit 1
          fi

          node -e '
            const r = require("/tmp/created-release.json");
            if (r.tag_name !== process.argv[1]) throw new Error("Created release tag mismatch");
            console.log(`Created GitHub Release ${r.tag_name}: ${r.html_url}`);
          ' "$tag"
