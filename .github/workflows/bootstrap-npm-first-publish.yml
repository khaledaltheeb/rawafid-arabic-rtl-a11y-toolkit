name: Bootstrap npm first publish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-npm-first-publish.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_PUBLISH_TOKEN || secrets.NODE_AUTH_TOKEN }}
      RELEASE_TAG: v0.2.0
    steps:
      - name: Require bootstrap npm credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo '::error::No npm bootstrap token is available under NPM_TOKEN, NPM_PUBLISH_TOKEN, or NODE_AUTH_TOKEN. No registry change was attempted.'
            exit 1
          fi

      - name: Checkout published release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify token identity without exposing token
        shell: bash
        run: npm whoami --registry=https://registry.npmjs.org/

      - name: Install and verify exact release source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check

      - name: Build exact release tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm pack --json --ignore-scripts > npm-pack.json
          tarball="$(node -e "const fs=require('fs'); const rows=JSON.parse(fs.readFileSync('npm-pack.json','utf8')); if (!Array.isArray(rows) || rows.length !== 1 || typeof rows[0].filename !== 'string') throw new Error('Expected one npm tarball'); process.stdout.write(rows[0].filename)")"
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"

      - name: Publish first package version if absent
        shell: bash
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "$package_name@$package_version" version --json >/dev/null 2>&1; then
            echo "$package_name@$package_version already exists; bootstrap publish skipped."
          else
            npm publish "$TARBALL" --access public --provenance
          fi

      - name: Verify registry artifact identity
        shell: bash
        env:
          LOCAL_INTEGRITY: ${{ steps.pack.outputs.integrity }}
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          registry_integrity=""
          for attempt in $(seq 1 10); do
            registry_integrity="$(npm view "$package_name@$package_version" dist.integrity 2>/dev/null || true)"
            [ "$registry_integrity" = "$LOCAL_INTEGRITY" ] && break
            sleep 3
          done
          if [ "$registry_integrity" != "$LOCAL_INTEGRITY" ]; then
            echo '::error::Published npm artifact identity could not be verified.'
            exit 1
          fi
          echo "Verified npm registry artifact identity: $LOCAL_INTEGRITY"
