# Trusted-main validation trigger for the public release and registry publication chain.
name: Release preflight

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-preflight.yml
      - .github/workflows/release.yml
      - scripts/normalize-spdx-sbom.mjs
      - scripts/check-spdx-conformance-report.mjs
      - scripts/check-release-policy.mjs
      - package.json
      - package-lock.json
  pull_request:
    paths:
      - .github/workflows/release-preflight.yml
      - .github/workflows/release.yml
      - scripts/normalize-spdx-sbom.mjs
      - scripts/check-spdx-conformance-report.mjs
      - scripts/check-release-policy.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate without publishing
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Build release candidate evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.17.0 --no-audit --no-fund
      - name: Require committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json || { echo 'Preflight failed: package-lock.json is required.' >&2; exit 1; }
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if (p.version !== l.version || p.version !== l.packages[''].version) throw new Error('package.json/package-lock.json version mismatch');"
      - name: Resolve versioned release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          release_tag="v${package_version}"
          source_path="docs/RELEASE-NOTES-${release_tag}.md"
          test -f "$source_path" || {
            echo "Preflight failed: required versioned release notes are missing: $source_path" >&2
            exit 1
          }
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_notes=$source_path" >> "$GITHUB_OUTPUT"
      - name: Install deterministically
        run: npm ci --no-audit --no-fund
      - name: Verify release candidate
        run: npm run check
      - name: Inspect package contents
        run: npm pack --dry-run
      - name: Build exact release-candidate tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm pack --json --ignore-scripts > npm-pack.json
          tarball="$(node -e "const fs=require('fs'); const rows=JSON.parse(fs.readFileSync('npm-pack.json','utf8')); if (!Array.isArray(rows) || rows.length !== 1 || typeof rows[0].filename !== 'string') throw new Error('Expected exactly one npm pack artifact'); process.stdout.write(rows[0].filename);")"
          test -f "$tarball" || { echo "Preflight tarball not found: $tarball" >&2; exit 1; }
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"
          echo "Built preflight candidate $tarball with $integrity"
      - name: Generate and normalize SPDX 2.3 SBOM
        shell: bash
        run: |
          set -euo pipefail
          npm sbom --sbom-format=spdx --sbom-type=library > sbom.spdx.json
          node scripts/normalize-spdx-sbom.mjs sbom.spdx.json
      - name: Verify SPDX document with SPDX Tools Java
        shell: bash
        env:
          SPDX_TOOLS_VERSION: '2.0.7'
          SPDX_TOOLS_SHA256: '2dc63c3399c5178058b1be8a3de6f13b9f24981cd86c4292ef98f4a7e90de36d'
        run: |
          set -euo pipefail
          command -v java >/dev/null || { echo 'Java runtime is required for SPDX Tools Verify.' >&2; exit 1; }
          archive="tools-java-${SPDX_TOOLS_VERSION}.zip"
          url="https://github.com/spdx/tools-java/releases/download/v${SPDX_TOOLS_VERSION}/${archive}"
          curl --fail --location --retry 3 --retry-delay 2 --output "$archive" "$url"
          echo "${SPDX_TOOLS_SHA256}  ${archive}" | sha256sum --check -
          rm -rf .spdx-tools
          mkdir .spdx-tools
          unzip -q "$archive" -d .spdx-tools
          jar_path="$(find .spdx-tools -type f -name "tools-java-${SPDX_TOOLS_VERSION}-jar-with-dependencies.jar" -print -quit)"
          test -n "$jar_path" || { echo 'Pinned SPDX Tools Java verifier JAR not found.' >&2; exit 1; }
          java -jar "$jar_path" Verify sbom.spdx.json | tee spdx-verify.txt
      - name: Audit NTIA minimum elements
        shell: bash
        env:
          NTIA_CHECKER_VERSION: '5.0.3'
        run: |
          set -euo pipefail
          python3 -m venv .spdx-venv
          .spdx-venv/bin/python -m pip install --disable-pip-version-check --no-input "ntia-conformance-checker==${NTIA_CHECKER_VERSION}"
          set +e
          .spdx-venv/bin/sbomcheck sbom.spdx.json --sbom-spec spdx2 --comply ntia --output json --output-file sbom-ntia-report.json
          checker_status=$?
          set -e
          if [ "$checker_status" -ne 0 ] && [ "$checker_status" -ne 1 ]; then
            echo "Unexpected NTIA checker exit status: $checker_status" >&2
            exit "$checker_status"
          fi
          node scripts/check-spdx-conformance-report.mjs sbom-ntia-report.json
      - name: Build reproducible public review surface
        run: npm run site:build
      - name: Write preflight manifest
        shell: bash
        env:
          PREFLIGHT_REF: ${{ inputs.ref || github.sha }}
          RELEASE_TAG: ${{ steps.release_notes.outputs.release_tag }}
          RELEASE_NOTES: ${{ steps.release_notes.outputs.release_notes }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          TARBALL_INTEGRITY: ${{ steps.pack.outputs.integrity }}
        run: |
          set -euo pipefail
          resolved_commit="$(git rev-parse HEAD)"
          export RESOLVED_COMMIT="$resolved_commit"
          node <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const evidence = {
            schemaVersion: 1,
            kind: 'rawafid-release-preflight',
            package: { name: pkg.name, version: pkg.version },
            requestedRef: process.env.PREFLIGHT_REF,
            resolvedCommit: process.env.RESOLVED_COMMIT,
            releaseTag: process.env.RELEASE_TAG,
            releaseNotes: process.env.RELEASE_NOTES,
            tarball: process.env.TARBALL,
            tarballIntegrity: process.env.TARBALL_INTEGRITY,
            sbom: 'sbom.spdx.json',
            reviewSiteManifest: 'review-site/artifact-manifest.json',
            publicationAttempted: false,
            attestationAttempted: false
          };
          fs.writeFileSync('release-preflight.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE
      - name: Upload preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-preflight-evidence
          path: |
            ${{ steps.pack.outputs.tarball }}
            npm-pack.json
            sbom.spdx.json
            spdx-verify.txt
            sbom-ntia-report.json
            ${{ steps.release_notes.outputs.release_notes }}
            release-preflight.json
            review-site/
          if-no-files-found: error
          retention-days: 30
