name: Publish npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify Trusted Publishing runtime
        shell: bash
        run: |
          node -e "const [M,m]=process.versions.node.split('.').map(Number); if (M < 22 || (M === 22 && m < 14)) throw new Error('Trusted Publishing requires Node >=22.14.0');"
          npm_version="$(npm --version)"
          node -e "const [M,m]=process.argv[1].split('.').map(Number); if (M < 11 || (M === 11 && m < 5)) throw new Error('Trusted Publishing requires npm >=11.5.1');" "$npm_version"
      - name: Require committed lockfile
        shell: bash
        run: |
          test -f package-lock.json || { echo 'Refusing release: commit package-lock.json first.' >&2; exit 1; }
      - name: Install deterministically
        run: npm ci --no-audit --no-fund
      - name: Verify release candidate
        run: npm run check
      - name: Inspect package contents
        run: npm pack --dry-run
      - name: Generate SPDX SBOM
        run: npm sbom --sbom-format=spdx --sbom-type=library > sbom.spdx.json
      - name: Upload release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish using npm Trusted Publishing
        run: npm publish --access public --provenance
