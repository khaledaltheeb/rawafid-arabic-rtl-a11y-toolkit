name: Publish npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release tag and runtime
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          test "$RELEASE_TAG" = "$expected_tag" || {
            echo "Refusing release: GitHub tag '$RELEASE_TAG' does not match package version '$package_version' (expected '$expected_tag')." >&2
            exit 1
          }
          node -e "const [M,m]=process.versions.node.split('.').map(Number); if (M < 22 || (M === 22 && m < 14)) throw new Error('Trusted Publishing requires Node >=22.14.0');"
          npm_version="$(npm --version)"
          node -e "const [M,m]=process.argv[1].split('.').map(Number); if (M < 11 || (M === 11 && m < 5)) throw new Error('Trusted Publishing requires npm >=11.5.1');" "$npm_version"
      - name: Require committed lockfile
        shell: bash
        run: |
          test -f package-lock.json || { echo 'Refusing release: commit package-lock.json first.' >&2; exit 1; }
      - name: Install deterministically
        run: npm ci --no-audit --no-fund
      - name: Verify release candidate
        run: npm run check
      - name: Inspect package contents
        run: npm pack --dry-run
      - name: Generate SPDX SBOM
        run: npm sbom --sbom-format=spdx --sbom-type=library > sbom.spdx.json
      - name: Upload release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Detect existing registry version
        id: registry
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          if npm view "$package_name@$package_version" version --json >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Registry already contains $package_name@$package_version; publish step will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Registry does not contain $package_name@$package_version; OIDC publish is required."
          fi
      - name: Publish using npm Trusted Publishing
        if: steps.registry.outputs.exists != 'true'
        run: npm publish --access public --provenance
      - name: Confirm idempotent release
        if: steps.registry.outputs.exists == 'true'
        run: echo "Release validation completed; ${{ steps.registry.outputs.package_name }}@${{ steps.registry.outputs.package_version }} was already present on npm."
